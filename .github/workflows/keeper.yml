name: Keeper (on-time posting loop)

# A self-restarting loop that does not depend on GitHub's unreliable cron or on any
# outside scheduler: each run sleeps until ~3 min before the next posting slot, starts
# publish.yml (which waits for the exact minute and posts), catches up anything overdue,
# and near its 6 h limit starts the next keeper run. The crons below only restart the
# loop if it ever breaks; the concurrency group keeps exactly one loop alive.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */2 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Loop until the next restart
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python scripts/keeper.py
      - name: Start the next keeper run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5 6; do
            gh workflow run keeper.yml -R "${{ github.repository }}" --ref main && exit 0
            sleep 20
          done
          exit 1
