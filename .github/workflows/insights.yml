name: Reel insights (nightly)

on:
  workflow_dispatch:
  schedule:
    - cron: "11 15 * * *"     # ~20:41 IST, before the nightly content run reads it

permissions:
  contents: write

concurrency:
  group: instagram-insights
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch insights
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/insights.py
      - name: Commit insights
        run: |
          git config user.name "abapcodevault-bot"
          git config user.email "abapcodevault-bot@users.noreply.github.com"
          git add insights
          git diff --cached --quiet && exit 0
          git commit -m "Update reel insights"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
