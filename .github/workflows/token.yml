name: Check and refresh Instagram token

on:
  schedule:
    - cron: "0 4 1,15 * *"   # 1st and 15th of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check token (and refresh if GH_PAT is set)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          REFRESH: ${{ secrets.GH_PAT != '' && secrets.IG_USER_ID == '' && '1' || '0' }}
        run: python scripts/check_token.py
      - name: Save refreshed token as the repo secret
        if: ${{ hashFiles('new_token.txt') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" < new_token.txt
          rm -f new_token.txt
          echo "IG_ACCESS_TOKEN secret updated."
